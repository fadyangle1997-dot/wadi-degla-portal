# CI quality gate — every push/PR must pass typecheck + tests + build before merge.
# This is the automated enforcement of the gate we ran manually every version.
#
# Phase 1 adds the server to the SAME gate rather than a second pipeline: the
# API imports src/domain/, so a change to the domain can break the server and
# must be caught in the run that reviews it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Typecheck (tooling + e2e)
        run: npx tsc --noEmit -p tsconfig.node.json

      # One suite: the existing app tests, the domain's Node-importability
      # contract, and the server's migration, constraint and health tests.
      # Server tests run against PGlite — real Postgres in-process — so CI
      # needs no database service.
      - name: Tests (app + domain + server) with coverage floors
        run: npx vitest run --coverage

      - name: Production build
        run: npm run build

      - name: Initial download budget
        run: npm run size

      # The bundle is public. Nothing in it may be a credential.
      - name: No credentials in the built bundle
        run: |
          if grep -rEq "postgres(ql)?://[^\"' ]*:[^\"'@ ]+@" dist/; then
            echo "::error::a database connection string reached the built bundle"
            exit 1
          fi
          if grep -rEq "Welcome@123|Admin@2026|password:\"" dist/; then
            echo "::error::a readable demo password reached the built bundle"
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high

      # The four role journeys, accessibility (axe, WCAG 2.1 AA) and CSP,
      # against the production build that was just made.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
