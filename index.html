    <!-- 🔴 QA fix — with no favicon and no /public directory, every browser
         silently requested /favicon.ico and logged a 404 to the console. It
         appeared intermittently in testing only because the failed request is
         cached per session, which is exactly what made it look like a phantom
         bug. An inlined data-URI keeps it to zero extra network requests and
         zero new files, and uses the platform's own gold-on-ink identity. -->
