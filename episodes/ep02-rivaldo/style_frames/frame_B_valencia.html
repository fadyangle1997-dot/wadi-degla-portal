<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../series/engine/tokens.css">
<style>
.stripes{position:absolute;inset:0;opacity:.16;background:repeating-linear-gradient(90deg,var(--fcbBlueDeep) 0,var(--fcbBlue) 40px,var(--fcbBlue) 95px,var(--fcbBlueDeep) 135px,var(--fcbGarnetDeep) 135px,var(--fcbGarnet) 175px,var(--fcbGarnet) 230px,var(--fcbGarnetDeep) 270px)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,8,.2) 0%,rgba(11,10,8,.85) 70%,var(--black900) 100%)}
.title{position:absolute;left:0;right:0;top:150px;text-align:center}
.title .meta{font-size:24px;color:var(--textSecondary)}
.title .big{font-size:140px;line-height:1.05;margin-top:6px}
.board{position:absolute;left:0;right:0;top:130px;display:flex;align-items:center;justify-content:center;gap:34px}
.code{font-size:120px;position:absolute;top:150px;transform:translateX(-50%)}
.dash{font-family:var(--fHero);font-weight:900;font-stretch:62.5%;font-size:90px;color:var(--textMuted)}
.min{position:absolute;left:0;right:0;top:350px;text-align:center}
</style></head><body><div class="canvas">
<div class="stripes"></div><div class="fade"></div>
<div class="chapter"><span class="num">VI</span><span class="name">ONE NIGHT</span><div class="rule"></div>
<div class="ticks"><i class="past"></i><i class="past"></i><i class="past"></i><i class="past"></i><i class="past"></i><i class="now"></i><i></i><i></i></div></div>
<div class="title"><div class="mono meta">CAMP NOU · LA LIGA · LAST MATCHDAY</div><div class="serif-i gold big">17 June 2001</div></div>
<div class="plate" style="left:60px;top:440px;width:960px;height:560px">
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div><div class="acc"></div>
  <div class="hero code" style="left:calc(50% - 360px);color:var(--white100)">BAR</div>
  <div class="hero code" style="left:calc(50% + 360px);color:var(--white100)">VAL</div>
  <div class="board">
    <div class="flap"><span class="gold">3</span></div>
    <div class="dash">–</div>
    <div class="flap"><span style="color:var(--white100)">2</span></div>
  </div>
  <div class="min"><span class="serif-i gold" style="font-size:96px;padding:0 .14em">87’</span>
    <div class="mono" style="font-size:24px;color:var(--textSecondary);margin-top:8px">RIVALDO · HAT-TRICK</div></div>
</div>
<div class="subs"><div>3-2.</div></div>
<div class="vignette"></div>
</div></body></html>
